name: Auto Update CVE Registry Database

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-cves:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CVE Fetcher & Accumulator
        run: node scripts/fetch_cves.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "leaklens-org"
          git config --global user.email "info@leaklens.org"
          
          git add CVE/
          if git diff --staged --quiet; then
            echo "No new CVE changes to commit."
          else
            git commit -m "chore(cve): auto-update CVE registry database [skip ci]"
            git push origin main
          fi
